name: rentacar

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Istanbul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 imajında doğru yol /var/lib/postgresql
      # (eski /var/lib/postgresql/data yolu 18'de konteyneri başlatmaz)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Konteyner içinde DB'nin adresi "db" (servis adı), port her zaman 5432
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"

volumes:
  pgdata:
