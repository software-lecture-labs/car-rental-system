spring:
  application:
    name: rentacar-backend
  profiles:
    # Hiç profil verilmezse "dev" kullanılır (Docker'da da IDE'de de)
    default: dev

  # Yerel geliştirme değerleri. Docker'da SPRING_DATASOURCE_* env değişkenleri bunları ezer.
  datasource:
    url: jdbc:postgresql://localhost:5432/rentacar
    username: rentacar
    password: rentacar_dev_123

  jpa:
    open-in-view: false
    hibernate:
      # Şemayı Flyway yönetir; Hibernate sadece entity'ler tabloyla uyuşuyor mu diye kontrol eder
      ddl-auto: validate

  flyway:
    locations: classpath:db/migration

  # Araç görseli yükleme: dosya başına en fazla 5 MB, tek istekte en fazla 10 görsel
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

# Sınırı aşan yüklemede bağlantıyı koparmak yerine 413 cevabı dönebilmek için
server:
  tomcat:
    max-swallow-size: 60MB

app:
  jwt:
    # secret burada YOK: dev profilinde application-dev.yml'den, gerçek ortamda APP_JWT_SECRET ortam değişkeninden gelir
    expiration: 2h
    issuer: rentacar
  cors:
    allowed-origins: http://localhost:3000